<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#6b4226">
  <title>บัตรสะสมแต้ม</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    // =====================================================
    //  วางลิงก์ Apps Script (ที่ลงท้ายด้วย /exec) ไว้ตรงนี้
    // =====================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbw9q-GccOLFN_Y82kthLFDAESQecJdcPodzPxPMjdKjsDsBoJgkSmoHCXhXR613SC7QlA/exec';
  </script>

  <style>
    :root {
      --bg: #f6efe6; --card: #fff; --brown: #6b4226; --brown-light: #a47551;
      --cream: #f3e3cf; --text: #3b2a1e; --muted: #8a7563; --ok: #2f7d4a; --err: #b3261e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 16px 40px; font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 440px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 18px; }
    header .logo { font-size: 40px; }
    header h1 { margin: 4px 0 0; font-size: 24px; color: var(--brown); }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    .card { background: var(--card); border-radius: 16px; padding: 22px 20px; box-shadow: 0 6px 24px rgba(107,66,38,.08); margin-bottom: 16px; }
    .card h2 { margin: 0 0 8px; font-size: 18px; color: var(--brown); }
    label { display: block; font-weight: 600; margin: 10px 0 6px; }
    input, select { width: 100%; padding: 12px; font: inherit; font-size: 17px; border: 1px solid #d9c6b3; border-radius: 10px; background: #fffdfa; }
    input:focus, select:focus { outline: none; border-color: var(--brown-light); box-shadow: 0 0 0 3px rgba(164,117,81,.2); }
    button, .btn {
      display: block; width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 10px;
      font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none;
      background: var(--brown); color: #fff;
    }
    .secondary { background: var(--cream) !important; color: var(--brown) !important; }
    .gift { background: #c8862a !important; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .check { display: flex; align-items: center; gap: 10px; font-weight: 600; margin: 4px 0 10px; }
    .check input { width: 22px; height: 22px; }
    .name { font-size: 20px; font-weight: 700; margin: 0; }
    .meta { color: var(--muted); font-size: 14px; margin: 2px 0 14px; }
    .stamps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 6px 0 14px; }
    .stamp { aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
             border: 2px dashed #d9c6b3; color: #c9b39c; font-weight: 600; font-size: 14px; }
    .stamp.on { border: 2px solid var(--brown); background: var(--cream); font-size: 20px; }
    .stamp.free { border-color: #c8862a; color: #c8862a; font-size: 18px; }
    .stamp.free.on { background: #c8862a; color: #fff; border-style: solid; }
    .status { text-align: center; font-size: 16px; font-weight: 600; }
    .banner { background: #fff4dd; border: 1px solid #f0cf8a; color: #8a5a00; padding: 10px 12px; border-radius: 10px;
              text-align: center; font-weight: 700; margin-bottom: 10px; }
    .qr { margin-top: 18px; padding-top: 16px; border-top: 1px dashed #e4d4c2; text-align: center; }
    .qrimg { display: inline-block; padding: 12px; background: #fff; border-radius: 12px; border: 1px solid #eee; }
    .qrimg img, .qrimg canvas { display: block; }
    .qrid { margin-top: 8px; font-family: monospace; font-size: 15px; letter-spacing: 1px; color: var(--muted); }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 15px; display: none; }
    .msg.ok { display: block; background: #e3f3e8; color: var(--ok); }
    .msg.err { display: block; background: #fbe4e2; color: var(--err); }
    .msg.warn { display: block; background: #fff4dd; color: #8a5a00; }
    .msg.info { display: block; background: #eef2f7; color: #334155; }
    .hidden { display: none !important; }
    .small { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }
    #reader { margin-top: 10px; border-radius: 12px; overflow: hidden; }
    #reader:empty { display: none; }
    .flash { animation: flash 1s ease; }
    @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(200,134,42,.8); } 100% { box-shadow: 0 0 0 18px rgba(200,134,42,0); } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">☕</div>
    <h1 id="shopName">บัตรสะสมแต้ม</h1>
    <p id="subtitle">กำลังโหลด...</p>
  </header>
  <div id="globalMsg" class="msg"></div>

  <!-- ================= หน้าลูกค้า: เช็กด้วยเบอร์ ================= -->
  <section id="customerView" class="hidden">
    <div class="card">
      <label for="cPhone">เบอร์โทรศัพท์</label>
      <input id="cPhone" type="tel" inputmode="numeric" placeholder="08xxxxxxxx">
      <button id="cBtn">ดูบัตรสะสมแต้ม</button>
      <div id="cMsg" class="msg"></div>
    </div>
  </section>

  <!-- ================= บัตรส่วนตัว ================= -->
  <section id="cardView" class="hidden">
    <div id="pCard" class="card"><p class="status">กำลังโหลด...</p></div>
    <div id="pMsg" class="msg"></div>
    <p class="small">ยื่น QR นี้ให้พนักงานสแกนทุกครั้งที่ซื้อ · หน้านี้อัปเดตแต้มอัตโนมัติ</p>
    <button id="pSwitch" class="secondary">ไม่ใช่บัตรของฉัน / เปลี่ยนเบอร์</button>
  </section>

  <!-- ================= หน้าพนักงาน ================= -->
  <section id="staffView" class="hidden">
    <div id="loginBox" class="card">
      <label for="pin">PIN พนักงาน</label>
      <input id="pin" type="password" inputmode="numeric">
      <button id="loginBtn">เข้าสู่ระบบ</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <div id="staffPanel" class="hidden">
      <div class="card">
        <h2>สแกน QR ลูกค้า</h2>
        <label class="check"><input type="checkbox" id="autoAdd" checked> สแกนแล้วเพิ่มแต้มอัตโนมัติ</label>
        <div class="row">
          <span>จำนวนแก้วต่อการสแกน</span>
          <select id="autoN"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
        </div>
        <div id="reader"></div>
        <button id="camBtn">📷 เปิดกล้องสแกน</button>
        <label class="btn secondary" style="font-weight:600">🖼️ สแกนจากรูปถ่าย
          <input type="file" id="fileScan" accept="image/*" capture="environment" hidden>
        </label>
        <input id="scanInput" placeholder="เครื่องสแกนบาร์โค้ด / พิมพ์รหัส แล้วกด Enter" style="margin-top:12px">
        <div id="reader-file" class="hidden"></div>
        <div id="scanMsg" class="msg"></div>
      </div>

      <div class="card">
        <h2>ค้นหาด้วยเบอร์โทร / สมัครใหม่</h2>
        <input id="sPhone" type="tel" inputmode="numeric" placeholder="08xxxxxxxx">
        <button id="findBtn" class="secondary">ค้นหา</button>
        <div id="sMsg" class="msg"></div>
      </div>

      <div id="regBox" class="card hidden">
        <p class="name">ยังไม่มีเบอร์นี้ในระบบ</p>
        <p class="meta">สมัครสมาชิกใหม่ด้วยเบอร์ <b id="regPhone"></b></p>
        <label for="regName">ชื่อลูกค้า</label>
        <input id="regName" placeholder="เช่น สมชาย">
        <button id="regBtn">สมัครสมาชิก</button>
      </div>

      <div id="custBox" class="card hidden">
        <div id="sCard"></div>
        <div class="row">
          <button data-add="1">+1 แก้ว</button>
          <button data-add="2">+2 แก้ว</button>
          <button data-add="3">+3 แก้ว</button>
        </div>
        <div class="row">
          <input id="addN" type="number" min="1" max="50" placeholder="จำนวนแก้ว" style="margin-top:12px">
          <button id="addNBtn" class="secondary">เพิ่ม</button>
        </div>
        <button id="redeemBtn" class="gift">🎁 แลกฟรี 1 แก้ว</button>
        <button id="showQrBtn" class="secondary">แสดง QR ของลูกค้า</button>
      </div>
    </div>
  </section>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const PAGE = params.get('page') === 'staff' ? 'staff' : (params.get('id') ? 'card' : 'customer');
  const TOKEN = (params.get('id') || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  const SITE_URL = location.origin + location.pathname;
  let GOAL = 10;
  const $ = id => document.getElementById(id);

  // ---------- เรียกหลังบ้าน (Apps Script) ----------
  async function call(action, ...args) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // แบบนี้ไม่ติดปัญหา CORS
      body: JSON.stringify({ action, args })
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    return j.data;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function showMsg(box, text, type) {
    box.textContent = text || '';
    box.className = 'msg ' + (text ? (type || 'info') : '');
  }
  function busy(btn, on, label) {
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || 'กำลังโหลด...'; btn.disabled = true; }
    else { if (btn.dataset.label) btn.textContent = btn.dataset.label; btn.disabled = false; }
  }
  function cardUrl(token) { return SITE_URL + '?id=' + token; }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.2, ctx.currentTime); o.start(); o.stop(ctx.currentTime + 0.15);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(100);
  }

  // จำบัตรลูกค้าไว้ในเครื่อง
  const STORE_KEY = 'cafe_card_token';
  function saveToken(t) { try { localStorage.setItem(STORE_KEY, t); } catch (e) {} }
  function loadToken() { try { return localStorage.getItem(STORE_KEY) || ''; } catch (e) { return ''; } }
  function clearToken() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

  // ---------- วาดบัตรสะสมแต้ม ----------
  function renderCard(box, c, opts) {
    opts = opts || {};
    box.innerHTML = '';
    box.appendChild(el('p', 'name', opts.title || ('สวัสดีคุณ ' + c.name)));
    if (opts.meta) box.appendChild(el('p', 'meta', opts.meta));

    const freeCount = Math.floor(c.stamps / GOAL);
    if (freeCount > 0) box.appendChild(el('div', 'banner', '🎉 มีสิทธิ์รับเครื่องดื่มฟรี ' + freeCount + ' แก้ว'));

    const grid = el('div', 'stamps');
    const filled = Math.min(c.stamps, GOAL);
    for (let i = 0; i < GOAL; i++) {
      grid.appendChild(el('div', 'stamp' + (i < filled ? ' on' : ''), i < filled ? '☕' : String(i + 1)));
    }
    grid.appendChild(el('div', 'stamp free' + (c.stamps >= GOAL ? ' on' : ''), '🎁'));
    box.appendChild(grid);
    box.appendChild(el('div', 'status',
      'แต้มสะสม ' + c.stamps + ' แก้ว · อีก ' + (GOAL - (c.stamps % GOAL)) + ' แก้วรับฟรีครั้งถัดไป'));

    if (opts.qr && c.token) {
      const q = el('div', 'qr');
      const holder = el('div', 'qrimg');
      q.appendChild(holder);
      if (typeof QRCode !== 'undefined') {
        new QRCode(holder, { text: cardUrl(c.token), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
      } else holder.textContent = 'โหลดตัวสร้าง QR ไม่สำเร็จ';
      q.appendChild(el('div', 'qrid', 'รหัส: ' + c.token));
      if (opts.qrNote) q.appendChild(el('div', 'small', opts.qrNote));
      box.appendChild(q);
    }
  }

  // ================= ลูกค้า: เช็กด้วยเบอร์ =================
  function initCustomer() {
    const saved = loadToken();
    if (saved) { initCard(saved); return; }
    $('customerView').classList.remove('hidden');
    const go = async () => {
      const btn = $('cBtn');
      showMsg($('cMsg'));
      busy(btn, true, 'กำลังตรวจสอบ...');
      try {
        const c = await call('checkCard', $('cPhone').value);
        if (!c) {
          showMsg($('cMsg'), 'ไม่พบเบอร์นี้ในระบบ สมัครสมาชิกได้ที่เคาน์เตอร์', 'err');
        } else {
          saveToken(c.token);
          $('customerView').classList.add('hidden');
          initCard(c.token);
        }
      } catch (e) { showMsg($('cMsg'), e.message, 'err'); }
      busy(btn, false);
    };
    $('cBtn').onclick = go;
    $('cPhone').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  // ================= บัตรส่วนตัว =================
  function initCard(token) {
    $('cardView').classList.remove('hidden');
    $('pSwitch').onclick = () => { clearToken(); location.href = SITE_URL; };
    let lastStamps = null;
    const load = async () => {
      try {
        const c = await call('getCardByToken', token);
        if (!c) { clearToken(); $('pCard').innerHTML = ''; $('pCard').appendChild(el('p', 'status', 'ไม่พบบัตรนี้ในระบบ')); return false; }
        saveToken(c.token);
        if (c.stamps !== lastStamps) {
          renderCard($('pCard'), c, { meta: 'มาล่าสุด: ' + c.lastVisit, qr: true });
          if (lastStamps !== null) {
            $('pCard').classList.remove('flash'); void $('pCard').offsetWidth; $('pCard').classList.add('flash');
            showMsg($('pMsg'), c.stamps > lastStamps ? '☕ ได้รับแต้มเพิ่มแล้ว! ขอบคุณที่อุดหนุนนะคะ' : '🎁 แลกเครื่องดื่มฟรีเรียบร้อย', 'ok');
          }
          lastStamps = c.stamps;
        }
        return true;
      } catch (e) { showMsg($('pMsg'), e.message, 'err'); return true; }
    };
    load().then(ok => { if (ok) setInterval(() => { if (!document.hidden) load(); }, 10000); });
  }

  // ================= พนักงาน =================
  let PIN = '';
  let current = null;
  let showQr = false;
  let scanner = null, camOn = false, scanning = false, lastScan = { text: '', at: 0 };

  function initStaff() {
    $('staffView').classList.remove('hidden');
    $('subtitle').textContent = 'หน้าพนักงาน';

    const login = async () => {
      const btn = $('loginBtn');
      busy(btn, true);
      try {
        if (await call('staffLogin', $('pin').value)) {
          PIN = $('pin').value;
          $('loginBox').classList.add('hidden');
          $('staffPanel').classList.remove('hidden');
          $('scanInput').focus();
        } else showMsg($('loginMsg'), 'PIN ไม่ถูกต้อง', 'err');
      } catch (e) { showMsg($('loginMsg'), e.message, 'err'); }
      busy(btn, false);
    };
    $('loginBtn').onclick = login;
    $('pin').onkeydown = e => { if (e.key === 'Enter') login(); };

    $('camBtn').onclick = async () => {
      const btn = $('camBtn');
      if (typeof Html5Qrcode === 'undefined') { showMsg($('scanMsg'), 'โหลดตัวสแกนไม่สำเร็จ ลองรีเฟรชหน้า', 'err'); return; }
      if (!scanner) scanner = new Html5Qrcode('reader');
      if (camOn) { await scanner.stop(); scanner.clear(); camOn = false; btn.textContent = '📷 เปิดกล้องสแกน'; return; }
      try {
        await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } }, onScan, () => {});
        camOn = true; btn.textContent = '⏹ ปิดกล้อง';
      } catch (e) {
        showMsg($('scanMsg'), 'เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์ หรือใช้ "สแกนจากรูปถ่าย" (' + e + ')', 'err');
      }
    };

    $('fileScan').onchange = async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file || typeof Html5Qrcode === 'undefined') return;
      try {
        const text = await new Html5Qrcode('reader-file').scanFile(file, false);
        processScan(text);
      } catch (err) { showMsg($('scanMsg'), 'อ่าน QR จากรูปไม่ได้ ลองถ่ายใหม่ให้ชัดและใกล้ขึ้น', 'err'); }
    };

    $('scanInput').onkeydown = e => {
      if (e.key === 'Enter' && $('scanInput').value.trim()) {
        processScan($('scanInput').value.trim());
        $('scanInput').value = '';
      }
    };

    const find = async () => {
      const btn = $('findBtn');
      showMsg($('sMsg'));
      $('regBox').classList.add('hidden');
      busy(btn, true, 'กำลังค้นหา...');
      try {
        const c = await call('staffFind', PIN, $('sPhone').value);
        if (c) { showQr = false; showCustomer(c); }
        else {
          $('custBox').classList.add('hidden');
          $('regPhone').textContent = $('sPhone').value.replace(/\D/g, '');
          $('regName').value = '';
          $('regBox').classList.remove('hidden');
          $('regName').focus();
        }
      } catch (e) { showMsg($('sMsg'), e.message, 'err'); }
      busy(btn, false);
    };
    $('findBtn').onclick = find;
    $('sPhone').onkeydown = e => { if (e.key === 'Enter') find(); };

    $('regBtn').onclick = async () => {
      const btn = $('regBtn');
      busy(btn, true, 'กำลังสมัคร...');
      try {
        const c = await call('staffRegister', PIN, $('sPhone').value, $('regName').value);
        $('regBox').classList.add('hidden');
        showQr = true;
        showCustomer(c);
        showMsg($('sMsg'), '✅ สมัครเรียบร้อย ให้ลูกค้าสแกน QR ด้วยกล้องมือถือเพื่อเปิดบัตรของตัวเอง', 'ok');
      } catch (e) { showMsg($('sMsg'), e.message, 'err'); }
      busy(btn, false);
    };

    const add = async (n, btn) => {
      busy(btn, true, '...');
      try {
        const c = await call('staffAddStamps', PIN, current.phone, n);
        busy(btn, false);
        showCustomer(c);
        showMsg($('sMsg'), '✅ เพิ่ม ' + n + ' แต้มให้คุณ ' + c.name + ' แล้ว', 'ok');
      } catch (e) { busy(btn, false); showMsg($('sMsg'), e.message, 'err'); }
    };
    document.querySelectorAll('[data-add]').forEach(b => { b.onclick = () => add(Number(b.dataset.add), b); });
    $('addNBtn').onclick = () => {
      const n = Number($('addN').value);
      if (!n || n < 1) { showMsg($('sMsg'), 'กรุณาใส่จำนวนแก้ว', 'err'); return; }
      add(n, $('addNBtn'));
      $('addN').value = '';
    };

    $('redeemBtn').onclick = async () => {
      if (!confirm('ยืนยันแลกเครื่องดื่มฟรี 1 แก้ว ให้คุณ ' + current.name + '?')) return;
      const btn = $('redeemBtn');
      busy(btn, true, 'กำลังแลก...');
      try {
        const c = await call('staffRedeem', PIN, current.phone);
        busy(btn, false);
        showCustomer(c);
        showMsg($('sMsg'), '🎁 แลกฟรีเรียบร้อย เหลือ ' + c.stamps + ' แต้ม', 'ok');
      } catch (e) { busy(btn, false); showCustomer(current); showMsg($('sMsg'), e.message, 'err'); }
    };

    $('showQrBtn').onclick = () => { showQr = !showQr; showCustomer(current); };
  }

  function onScan(text) {
    const now = Date.now();
    if (scanning) return;
    if (text === lastScan.text && now - lastScan.at < 5000) return;
    lastScan = { text, at: now };
    processScan(text);
  }

  async function processScan(text) {
    scanning = true;
    showMsg($('scanMsg'), 'กำลังตรวจสอบ...', 'info');
    try {
      const n = $('autoAdd').checked ? Number($('autoN').value) : 0;
      const r = await call('staffScan', PIN, text, n);
      showQr = false;
      showCustomer(r.customer);
      const name = r.customer.name;
      if (r.duplicate) {
        showMsg($('scanMsg'), '⚠️ คุณ ' + name + ' เพิ่งได้แต้มไปเมื่อสักครู่ จึงไม่เพิ่มซ้ำ (ถ้าซื้อเพิ่มจริงให้กดปุ่ม +1 ด้านล่าง)', 'warn');
      } else if (r.added > 0) {
        beep();
        showMsg($('scanMsg'), '✅ +' + r.added + ' แต้ม ให้คุณ ' + name + ' (รวม ' + r.customer.stamps + ')', 'ok');
      } else {
        showMsg($('scanMsg'), 'พบลูกค้า: คุณ ' + name, 'ok');
      }
      $('custBox').classList.remove('flash'); void $('custBox').offsetWidth; $('custBox').classList.add('flash');
    } catch (e) { showMsg($('scanMsg'), e.message, 'err'); }
    scanning = false;
  }

  function showCustomer(c) {
    current = c;
    renderCard($('sCard'), c, {
      title: c.name + ' (' + c.phone + ')',
      meta: 'แลกฟรีไปแล้ว ' + c.freeRedeemed + ' แก้ว · สะสมทั้งหมด ' + c.totalStamps + ' แก้ว · มาล่าสุด ' + c.lastVisit,
      qr: showQr,
      qrNote: 'ให้ลูกค้าสแกนด้วยกล้องมือถือ เพื่อเปิดบัตรและบันทึกไว้ใช้ครั้งต่อไป'
    });
    $('redeemBtn').disabled = c.stamps < GOAL;
    $('showQrBtn').textContent = showQr ? 'ซ่อน QR' : 'แสดง QR ของลูกค้า';
    $('custBox').classList.remove('hidden');
  }

  // ================= เริ่มทำงาน =================
  (async () => {
    try {
      const cfg = await call('config');
      GOAL = cfg.goal;
      document.title = cfg.shopName + ' – สะสมแต้ม';
      $('shopName').textContent = cfg.shopName;
      $('subtitle').textContent = 'สะสมครบ ' + GOAL + ' แก้ว รับฟรี 1 แก้ว';
    } catch (e) {
      $('subtitle').textContent = '';
      showMsg($('globalMsg'), 'เชื่อมต่อระบบหลังบ้านไม่ได้ ตรวจสอบ API_URL ใน index.html และการ Deploy Apps Script (' + e.message + ')', 'err');
      return;
    }
    if (PAGE === 'staff') initStaff();
    else if (PAGE === 'card') initCard(TOKEN);
    else initCustomer();
  })();
</script>
</body>
</html>
